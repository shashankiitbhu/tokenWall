<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#FCFCFC" />
    </linearGradient>

    <!-- Super Subtle Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-opacity="0.04" flood-color="#000000" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#F1EFEA" stroke-width="1"/>
    </pattern>
  </defs>

  <style>
    .title { font-family: 'Inter', -apple-system, sans-serif; font-weight: 700; letter-spacing: -0.03em; }
    .subtitle { font-family: 'Inter', -apple-system, sans-serif; font-weight: 600; letter-spacing: -0.01em; }
    .body-text { font-family: 'Inter', -apple-system, sans-serif; font-weight: 400; letter-spacing: -0.01em; }
    .mono { font-family: 'SFMono-Regular', Consolas, Menlo, monospace; }
  </style>

  <!-- Base Background -->
  <rect width="1200" height="630" fill="#FAF9F5" />
  <rect width="1200" height="630" fill="url(#grid)" />
  
  <!-- Subtle top accent line -->
  <rect x="0" y="0" width="1200" height="4" fill="#111111" />

  <!-- ================= HEADER SECTION (Centered) ================= -->
  
  <g transform="translate(600, 60)">
    <!-- Logo -->
    <rect x="-18" y="0" width="36" height="36" rx="10" fill="#111111" />
    <text x="0" y="25" fill="#ffffff" font-size="18" font-family="'Inter', sans-serif" font-weight="800" text-anchor="middle">T</text>
    
    <!-- Title -->
    <text class="title" fill="#111111" font-size="48" x="0" y="90" text-anchor="middle">Run AI Agents with Confidence</text>
    
    <!-- Subtitle -->
    <text class="body-text" fill="#6B7280" font-size="20" x="0" y="125" text-anchor="middle">Stop runaway API costs and compress prompts by 65%—without sacrificing LLM intelligence.</text>
  </g>

  <!-- ================= 3-COLUMN CARDS ================= -->

  <!-- Card 1: Compression -->
  <g transform="translate(60, 240)">
    <rect width="340" height="330" rx="16" fill="url(#cardGrad)" stroke="#E5E7EB" stroke-width="1" filter="url(#shadow)" />
    
    <!-- Icon -->
    <rect x="30" y="30" width="40" height="40" rx="10" fill="#F3F4F6" />
    <path d="M42,50 L58,50 M46,45 L54,45 M48,55 L52,55" stroke="#111111" stroke-width="2" stroke-linecap="round" />
    
    <text class="subtitle" fill="#111111" font-size="20" x="30" y="105">Adaptive Compression</text>
    <text class="body-text" fill="#6B7280" font-size="14" x="30" y="135">Stop paying for diagnostic noise.</text>
    <text class="body-text" fill="#6B7280" font-size="14" x="30" y="155">TokenWall dynamically strips bloated</text>
    <text class="body-text" fill="#6B7280" font-size="14" x="30" y="175">JSON and irrelevant logs before they hit</text>
    <text class="body-text" fill="#6B7280" font-size="14" x="30" y="195">the LLM, preserving critical signal.</text>

    <!-- Visual -->
    <g transform="translate(30, 235)">
      <rect x="0" y="0" width="280" height="30" rx="6" fill="#F3F4F6" />
      <rect x="0" y="0" width="98" height="30" rx="6" fill="#111111" />
      <text class="mono" fill="#ffffff" font-size="11" font-weight="600" x="49" y="19" text-anchor="middle">35% Signal</text>
      <text class="mono" fill="#9CA3AF" font-size="11" x="189" y="19" text-anchor="middle">65% Noise Filtered</text>
    </g>
  </g>

  <!-- Card 2: Governance -->
  <g transform="translate(430, 240)">
    <rect width="340" height="330" rx="16" fill="url(#cardGrad)" stroke="#E5E7EB" stroke-width="1" filter="url(#shadow)" />
    
    <!-- Icon -->
    <rect x="30" y="30" width="40" height="40" rx="10" fill="#F3F4F6" />
    <circle cx="50" cy="50" r="8" fill="none" stroke="#111111" stroke-width="2" />
    <path d="M50,42 L50,38 M50,62 L50,58 M42,50 L38,50 M62,50 L58,50" stroke="#111111" stroke-width="2" stroke-linecap="round" />
    
    <text class="subtitle" fill="#111111" font-size="20" x="30" y="105">Spend Governance</text>
    <text class="body-text" fill="#6B7280" font-size="14" x="30" y="135">Never wake up to a $10,000 API bill.</text>
    <text class="body-text" fill="#6B7280" font-size="14" x="30" y="155">Set strict financial budgets and let</text>
    <text class="body-text" fill="#6B7280" font-size="14" x="30" y="175">TokenWall instantly sever connections if</text>
    <text class="body-text" fill="#6B7280" font-size="14" x="30" y="195">an agent enters an infinite loop.</text>

    <!-- Visual -->
    <g transform="translate(30, 235)">
      <text class="mono" fill="#111111" font-size="11" font-weight="600" x="0" y="5">Budget Hard Limit</text>
      <text class="mono" fill="#EF4444" font-size="11" font-weight="600" x="280" y="5" text-anchor="end">$50.00</text>
      <rect x="0" y="15" width="280" height="10" rx="5" fill="#F3F4F6" />
      <rect x="0" y="15" width="260" height="10" rx="5" fill="#111111" />
      <!-- Circuit breaker icon indicator -->
      <path d="M 260,10 L 260,30" stroke="#EF4444" stroke-width="2" />
    </g>
  </g>

  <!-- Card 3: Telemetry -->
  <g transform="translate(800, 240)">
    <rect width="340" height="330" rx="16" fill="url(#cardGrad)" stroke="#E5E7EB" stroke-width="1" filter="url(#shadow)" />
    
    <!-- Icon -->
    <rect x="30" y="30" width="40" height="40" rx="10" fill="#F3F4F6" />
    <path d="M42,55 L48,45 L52,50 L58,40" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    
    <text class="subtitle" fill="#111111" font-size="20" x="30" y="105">Global Telemetry</text>
    <text class="body-text" fill="#6B7280" font-size="14" x="30" y="135">Total fleet visibility. Monitor token flows,</text>
    <text class="body-text" fill="#6B7280" font-size="14" x="30" y="155">trace LLM latencies, and track ROI</text>
    <text class="body-text" fill="#6B7280" font-size="14" x="30" y="175">across your entire network of</text>
    <text class="body-text" fill="#6B7280" font-size="14" x="30" y="195">autonomous coding agents in real-time.</text>

    <!-- Visual -->
    <g transform="translate(30, 245)">
      <path d="M 0,20 L 40,5 L 80,15 L 120,-5 L 160,10 L 200,-10 L 240,5 L 280,-15" fill="none" stroke="#E5E7EB" stroke-width="2" />
      <!-- Secondary line -->
      <path d="M 0,10 L 40,25 L 80,5 L 120,25 L 160,-5 L 200,10 L 240,-10 L 280,15" fill="none" stroke="#111111" stroke-width="2" />
      <circle cx="160" cy="-5" r="3" fill="#111111" />
      <circle cx="240" cy="-10" r="3" fill="#111111" />
    </g>
  </g>

</svg>
