<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#FCFCFC" />
    </linearGradient>

    <!-- Drop Shadow for Cards -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.03" flood-color="#000000" />
    </filter>
    
    <!-- Stripe Pattern for Noise -->
    <pattern id="stripes" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#F3F4F6" />
      <line x1="0" y1="0" x2="0" y2="8" stroke="#E5E7EB" stroke-width="4" />
    </pattern>
  </defs>

  <style>
    .title { font-family: 'Outfit', 'Inter', -apple-system, sans-serif; font-weight: 800; }
    .subtitle { font-family: 'Inter', -apple-system, sans-serif; font-weight: 600; }
    .body-text { font-family: 'Inter', -apple-system, sans-serif; }
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
  </style>

  <!-- Clean Off-White Background -->
  <rect width="1200" height="630" fill="#FAF9F5" />

  <!-- Extremely Subtle Grid for Technical Feel -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#F1EFEA" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Outer Border -->
  <rect x="0.5" y="0.5" width="1199" height="629" fill="none" stroke="#E2E0D9" stroke-width="1" rx="16" />

  <!-- ================= LEFT COLUMN ================= -->

  <!-- Logo and Header -->
  <g transform="translate(50, 50)">
    <rect width="32" height="32" rx="8" fill="#111111" />
    <text x="10" y="22" fill="#ffffff" font-size="16" font-family="'Outfit', sans-serif" font-weight="900">T</text>
    <text x="45" y="22" fill="#111111" font-size="20" font-family="'Outfit', sans-serif" font-weight="800" letter-spacing="-0.02em">TokenWall</text>
    
    <rect x="155" y="4" width="85" height="22" rx="4" fill="#E5E7EB" />
    <text x="197" y="19" fill="#374151" font-size="10" font-family="'Inter', sans-serif" font-weight="700" letter-spacing="0.05em" text-anchor="middle">CASE STUDY</text>
  </g>

  <!-- Main Hero Title -->
  <g transform="translate(50, 130)">
    <text class="title" fill="#111111" font-size="42" letter-spacing="-0.03em" y="0">Agent vs. Memory Leak</text>
    <!-- Broken into lines to fit safely within the 490px left column width -->
    <text class="body-text" fill="#4B5563" font-size="15" font-weight="400" y="40">Without TokenWall, autonomous agents are</text>
    <text class="body-text" fill="#4B5563" font-size="15" font-weight="400" y="65">frequently blinded by diagnostic noise, pulling</text>
    <text class="body-text" fill="#4B5563" font-size="15" font-weight="400" y="90">25,000+ tokens of raw Webpack logs just to</text>
    <text class="body-text" fill="#4B5563" font-size="15" font-weight="400" y="115">find a single component bug.</text>
  </g>

  <!-- Impact Metrics -->
  <g transform="translate(50, 280)">
    <!-- Metric 1: Signal to Noise -->
    <g transform="translate(0, 0)">
      <rect width="230" height="105" rx="12" fill="url(#cardGrad)" stroke="#E5E7EB" stroke-width="1" filter="url(#shadow)" />
      <text class="body-text" fill="#6B7280" font-size="11" font-weight="600" letter-spacing="0.05em" x="20" y="30">NOISE ELIMINATED</text>
      <text class="title" fill="#111827" font-size="36" font-weight="800" x="20" y="68">87.2%</text>
      <text class="body-text" fill="#10B981" font-size="12" font-weight="600" x="20" y="90">21k tokens removed</text>
    </g>

    <!-- Metric 2: Resolution Speed -->
    <g transform="translate(250, 0)">
      <rect width="230" height="105" rx="12" fill="url(#cardGrad)" stroke="#E5E7EB" stroke-width="1" filter="url(#shadow)" />
      <text class="body-text" fill="#6B7280" font-size="11" font-weight="600" letter-spacing="0.05em" x="20" y="30">AGENT SUCCESS RATE</text>
      <text class="title" fill="#111827" font-size="36" font-weight="800" x="20" y="68">3x</text>
      <text class="body-text" fill="#4B5563" font-size="12" font-weight="500" x="20" y="90">Faster bug resolution</text>
    </g>
    
    <!-- Metric 3: LLM Cost -->
    <g transform="translate(0, 125)">
      <rect width="480" height="105" rx="12" fill="url(#cardGrad)" stroke="#E5E7EB" stroke-width="1" filter="url(#shadow)" />
      <text class="body-text" fill="#6B7280" font-size="11" font-weight="600" letter-spacing="0.05em" x="20" y="30">LLM COST PER ATTEMPT (CLAUDE OPUS)</text>
      
      <!-- Cost Comparison Text -->
      <text class="title" fill="#EF4444" font-size="28" font-weight="800" x="20" y="70"><tspan text-decoration="line-through">$0.13</tspan></text>
      <path d="M 105,60 L 125,60 M 115,50 L 125,60 L 115,70" stroke="#9CA3AF" stroke-width="2" fill="none" />
      <text class="title" fill="#10B981" font-size="36" font-weight="800" x="140" y="72">$0.02</text>
      
      <text class="body-text" fill="#6B7280" font-size="12" font-weight="500" x="20" y="94">Saved $0.11 per loop on a 15-loop task</text>
    </g>
  </g>

  <!-- ================= RIGHT COLUMN ================= -->

  <!-- Deep Data Dashboard Box -->
  <g transform="translate(560, 50)">
    <!-- White Card Box container -->
    <rect width="590" height="530" rx="16" fill="#ffffff" stroke="#E5E7EB" stroke-width="1" filter="url(#shadow)" />
    
    <text class="subtitle" fill="#111827" font-size="18" x="40" y="45">Finding the needle in the haystack</text>
    <text class="body-text" fill="#6B7280" font-size="13" x="40" y="65">Visualizing the agent's context window before and after optimization</text>
    
    <!-- CONTEXT WINDOW VISUALIZATION -->
    <g transform="translate(40, 110)">
      
      <!-- Baseline Stack -->
      <text class="body-text" fill="#111827" font-size="13" font-weight="700" x="0" y="0">RAW CONTEXT WINDOW (24,800 TOKENS)</text>
      <text class="body-text" fill="#EF4444" font-size="11" font-weight="600" x="0" y="18">Cost: $0.124 / loop  |  LLM confusion high</text>
      
      <!-- Block 1: Webpack Logs (Noise) -->
      <rect x="0" y="35" width="480" height="60" rx="6" fill="url(#stripes)" stroke="#D1D5DB" stroke-width="1" />
      <text class="title" fill="#6B7280" font-size="14" x="20" y="60">Webpack Build Logs &amp; Dependencies JSON</text>
      <text class="mono" fill="#9CA3AF" font-size="11" x="20" y="78">12,500 tokens (Irrelevant noise)</text>
      
      <!-- Block 2: Unrelated Components (Noise) -->
      <rect x="0" y="100" width="480" height="45" rx="6" fill="url(#stripes)" stroke="#D1D5DB" stroke-width="1" />
      <text class="title" fill="#6B7280" font-size="14" x="20" y="120">Unrelated React Components</text>
      <text class="mono" fill="#9CA3AF" font-size="11" x="20" y="136">6,200 tokens (Wrong intent)</text>
      
      <!-- Block 3: Boilerplate (Noise) -->
      <rect x="0" y="150" width="480" height="30" rx="6" fill="url(#stripes)" stroke="#D1D5DB" stroke-width="1" />
      <text class="title" fill="#6B7280" font-size="14" x="20" y="170">Boilerplate &amp; Comments</text>

      <!-- Block 4: Critical Context (Signal) -->
      <rect x="0" y="185" width="480" height="40" rx="6" fill="#10B981" />
      <text class="title" fill="#ffffff" font-size="14" x="20" y="205">MemoryLeakComponent.tsx (AST Minified)</text>
      <text class="mono" fill="#ECFDF5" font-size="11" x="20" y="218">3,100 tokens (CRITICAL SIGNAL)</text>

      <!-- Connector Arrow -->
      <path d="M 240,240 L 240,280" stroke="#E5E7EB" stroke-width="2" />
      <polygon points="240,285 235,275 245,275" fill="#E5E7EB" />
      
      <!-- Optimized Stack -->
      <text class="body-text" fill="#111827" font-size="13" font-weight="700" x="0" y="310">TOKENWALL OPTIMIZED (3,100 TOKENS)</text>
      <text class="body-text" fill="#10B981" font-size="11" font-weight="600" x="0" y="328">Cost: $0.015 / loop  |  Zero LLM distraction</text>
      
      <!-- Just the Critical Context -->
      <rect x="0" y="345" width="480" height="40" rx="6" fill="#10B981" />
      <text class="title" fill="#ffffff" font-size="14" x="20" y="365">MemoryLeakComponent.tsx (AST Minified)</text>
      <text class="mono" fill="#ECFDF5" font-size="11" x="460" y="370" text-anchor="end">100% SIGNAL</text>
    </g>
  </g>

</svg>
