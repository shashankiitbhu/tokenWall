<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.05" flood-color="#000000" />
    </filter>
  </defs>

  <style>
    .title { font-family: 'Outfit', 'Inter', sans-serif; font-weight: 800; }
    .subtitle { font-family: 'Inter', sans-serif; font-weight: 600; }
    .body-text { font-family: 'Inter', sans-serif; }
  </style>

  <!-- Warm White Solid Background -->
  <rect width="1200" height="630" fill="#FAF9F5" />

  <!-- Subtle Light Grey Grid Lines -->
  <path d="M 0,105 L 1200,105 M 0,210 L 1200,210 M 0,315 L 1200,315 M 0,420 L 1200,420 M 0,525 L 1200,525" stroke="#F1EFEA" stroke-width="1" />
  <path d="M 120,0 L 120,630 M 240,0 L 240,630 M 360,0 L 360,630 M 480,0 L 480,630 M 600,0 L 600,630 M 720,0 L 720,630 M 840,0 L 840,630 M 960,0 L 960,630 M 1080,0 L 1080,630" stroke="#F1EFEA" stroke-width="1" />

  <!-- Outer Border -->
  <rect x="0.5" y="0.5" width="1199" height="629" fill="none" stroke="#E2E0D9" stroke-width="1" rx="16" />

  <!-- Header -->
  <g transform="translate(60, 60)">
    <text class="title" fill="#111111" font-size="40" letter-spacing="-0.02em">The TokenWall Optimization Pipeline</text>
    <text class="body-text" fill="#6B7280" font-size="16" font-weight="400" y="30">How AI Agent requests are silently optimized in under 70ms before reaching the LLM</text>
  </g>

  <!-- ================= PIPELINE VISUAL ================= -->

  <!-- 1. AI Agent (Source) -->
  <g transform="translate(80, 240)" filter="url(#shadow)">
    <rect width="160" height="120" rx="16" fill="#ffffff" stroke="#E5E7EB" stroke-width="1" />
    <circle cx="80" cy="50" r="24" fill="#F3F4F6" />
    <!-- Bot Icon -->
    <path d="M70,45 L90,45 L90,55 L70,55 Z M65,55 L95,55 L95,65 L65,65 Z" fill="#6B7280" />
    <circle cx="75" cy="50" r="2" fill="#111111" />
    <circle cx="85" cy="50" r="2" fill="#111111" />
    <text class="subtitle" fill="#111827" font-size="16" x="80" y="95" text-anchor="middle">AI Agent</text>
    <!-- Token Bloat representation -->
    <text class="title" fill="#EF4444" font-size="14" x="80" y="115" text-anchor="middle">100% Bloat</text>
  </g>

  <!-- Connecting Path 1 -->
  <path d="M 240,300 L 300,300" stroke="#D1D5DB" stroke-width="4" stroke-dasharray="8,4" fill="none" />
  <polygon points="300,300 290,295 290,305" fill="#D1D5DB" />

  <!-- 2. TokenWall Core Engine Box -->
  <g transform="translate(320, 160)" filter="url(#shadow)">
    <!-- Container -->
    <rect width="480" height="280" rx="24" fill="#ffffff" stroke="#E5E7EB" stroke-width="1" />
    
    <text class="title" fill="#111827" font-size="20" x="240" y="45" text-anchor="middle">TokenWall Context Engine</text>
    <rect x="180" y="55" width="120" height="20" rx="10" fill="#F3F4F6" />
    <text class="body-text" fill="#4B5563" font-size="10" font-weight="700" letter-spacing="0.1em" x="240" y="69" text-anchor="middle">&lt; 70ms LATENCY</text>

    <!-- Stage A: Query Analysis -->
    <g transform="translate(40, 100)">
      <rect width="180" height="60" rx="12" fill="#ffffff" stroke="#E5E7EB" stroke-width="1" />
      <circle cx="30" cy="30" r="14" fill="#F3F4F6" />
      <path d="M 25,25 L 35,35 M 35,25 L 25,35" stroke="#111111" stroke-width="2" />
      <text class="subtitle" fill="#111827" font-size="14" x="55" y="28">Query Analyzer</text>
      <text class="body-text" fill="#6B7280" font-size="10" x="55" y="44">Extracts Intent Keywords</text>
    </g>

    <!-- Stage B: Code Minification -->
    <g transform="translate(260, 100)">
      <rect width="180" height="60" rx="12" fill="#ffffff" stroke="#E5E7EB" stroke-width="1" />
      <circle cx="30" cy="30" r="14" fill="#F3F4F6" />
      <text class="subtitle" fill="#111827" font-size="14" x="55" y="28">Code Compressor</text>
      <text class="body-text" fill="#6B7280" font-size="10" x="55" y="44">AST Minification via SWC</text>
    </g>

    <!-- Stage C: JSON Crushing -->
    <g transform="translate(40, 180)">
      <rect width="180" height="60" rx="12" fill="#ffffff" stroke="#E5E7EB" stroke-width="1" />
      <circle cx="30" cy="30" r="14" fill="#F3F4F6" />
      <text class="subtitle" fill="#111827" font-size="14" x="55" y="28">Payload Crusher</text>
      <text class="body-text" fill="#6B7280" font-size="10" x="55" y="44">JSON Tree Optimization</text>
    </g>

    <!-- Stage D: Log Pruning -->
    <g transform="translate(260, 180)">
      <rect width="180" height="60" rx="12" fill="#ffffff" stroke="#E5E7EB" stroke-width="1" />
      <circle cx="30" cy="30" r="14" fill="#F3F4F6" />
      <text class="subtitle" fill="#111827" font-size="14" x="55" y="28">Log Pruner</text>
      <text class="body-text" fill="#6B7280" font-size="10" x="55" y="44">Importance Signal Scoring</text>
    </g>

    <!-- Connecting Arrows Inside Box -->
    <path d="M 220,130 L 250,130" stroke="#D1D5DB" stroke-width="2" />
    <path d="M 220,210 L 250,210" stroke="#D1D5DB" stroke-width="2" />
    <path d="M 130,160 L 130,180" stroke="#D1D5DB" stroke-width="2" />
    <path d="M 350,160 L 350,180" stroke="#D1D5DB" stroke-width="2" />
  </g>

  <!-- Connecting Path 2 -->
  <path d="M 800,300 L 860,300" stroke="#D1D5DB" stroke-width="4" stroke-dasharray="8,4" fill="none" />
  <polygon points="860,300 850,295 850,305" fill="#D1D5DB" />

  <!-- 3. LLM API (Destination) -->
  <g transform="translate(880, 240)" filter="url(#shadow)">
    <rect width="160" height="120" rx="16" fill="#ffffff" stroke="#E5E7EB" stroke-width="1" />
    <circle cx="80" cy="50" r="24" fill="#F3F4F6" />
    <!-- Claude/Anthropic inspired icon -->
    <path d="M65,45 L80,35 L95,45 L95,60 L80,70 L65,60 Z" fill="#111111" />
    <text class="subtitle" fill="#111827" font-size="16" x="80" y="95" text-anchor="middle">LLM API</text>
    <!-- Optimized representation -->
    <text class="title" fill="#10B981" font-size="14" x="80" y="115" text-anchor="middle">-65% Context</text>
  </g>

  <!-- Watermark / Footer -->
  <text class="body-text" fill="rgba(17, 24, 39, 0.3)" font-size="10" font-weight="600" letter-spacing="0.1em" x="1140" y="605" text-anchor="end">TOKENWALL BENCHMARKS 2026</text>
</svg>
